
id: qrlconfig-test
name: "qrl_config RPC consistency test (EIP-7910)"
timeout: 1h
config:
#walletPrivkey: ""
tasks:
  - name: check_clients_are_healthy
    title: "Wait for at least one client to be responding"
    timeout: 5m
    config:
      minClientCount: 1
  - name: check_qrl_config
    title: "Check qrl_config consistency across all execution clients"
    timeout: 5m
    config:
      failOnMismatch: true
      excludeSyncingClients: false
